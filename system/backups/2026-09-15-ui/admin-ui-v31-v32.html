<script id="admin-closed-day-text-cleanup-v31">
(function(){
  if(window.__chvostikovoClosedDayTextCleanupV31)return;
  window.__chvostikovoClosedDayTextCleanupV31=true;
  const target='Škôlka je v tento deň zatvorená. Existujúce rezervácie zostali zachované.';
  function clean(root=document){
    root.querySelectorAll?.('#weekList .warning-box,#nextWeekList .warning-box').forEach(el=>{
      if((el.textContent||'').trim()===target)el.remove();
    });
  }
  function start(){
    clean();
    ['weekList','nextWeekList'].forEach(id=>{
      const root=document.getElementById(id);
      if(root)new MutationObserver(()=>clean(root)).observe(root,{childList:true,subtree:true});
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>

<script id="admin-ui-v32">
(function(){
  if(window.__chvostikovoAdminUiV32)return;
  window.__chvostikovoAdminUiV32=true;
  const icons={
    today:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5"></path><path d="M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"></path></svg>',
    week:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M7 3v4M17 3v4M3 10h18"></path></svg>',
    dogs:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="7" r="2"></circle><circle cx="16" cy="7" r="2"></circle><circle cx="5.5" cy="12" r="2"></circle><circle cx="18.5" cy="12" r="2"></circle><path d="M12 11.5c-3 0-5 2.2-5 4.7 0 2.1 1.8 3.3 5 3.3s5-1.2 5-3.3c0-2.5-2-4.7-5-4.7Z"></path></svg>',
    stats:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>'
  };
  const labels={today:'Prehľad',week:'Týždeň',dogs:'Psy',stats:'Štatistiky'};
  let quickTimer=0;
  function upgradeNav(){
    const nav=document.getElementById('bottomNav');if(!nav)return;
    nav.querySelectorAll('button[data-tab]').forEach(btn=>{
      const tab=btn.dataset.tab;if(!icons[tab])return;
      if(btn.dataset.v32Nav==='1')return;
      btn.dataset.v32Nav='1';
      btn.innerHTML='<span class="admin-nav-icon-v32">'+icons[tab]+'</span><span class="admin-nav-label-v32">'+labels[tab]+'</span>';
    });
  }
  function numberFrom(text){const m=String(text||'').match(/\d+/);return m?Number(m[0]):0}
  function upgradeWeek(root){
    if(!root)return;
    [...root.children].forEach(card=>{
      if(!card.classList.contains('card')||card.dataset.weekV32==='1')return;
      const title=card.querySelector('.day-title'),capacity=card.querySelector('.day-capacity');
      if(!title||!capacity)return;
      card.dataset.weekV32='1';card.classList.add('week-day-card-v32');
      const pills=[...title.querySelectorAll('.pill')];
      const closed=pills.some(p=>/zatvorené/i.test(p.textContent||''));
      const countPill=pills.find(p=>/psov/i.test(p.textContent||''));
      const count=numberFrom(countPill?.textContent),cap=numberFrom(capacity.textContent);
      if(countPill)countPill.classList.add('v32-source-count');
      capacity.classList.add('capacity-ratio-v32');
      if(closed){capacity.textContent=cap+' max';capacity.classList.add('v32-closed-capacity')}
      else{
        capacity.textContent=count+' / '+cap;
        if(count>cap)capacity.classList.add('v32-over');else if(count===cap&&cap>0)capacity.classList.add('v32-full');
      }
      const add=card.querySelector('.day-add');
      if(add){add.textContent='+';add.classList.add('day-add-v32');add.title='Pridať psa';add.setAttribute('aria-label','Pridať psa')}
    });
  }
  function pendingCount(){
    const badge=document.querySelector('#overviewReservationsV22 .v25-live-badge.count');
    if(badge)return numberFrom(badge.textContent);
    const pill=document.querySelector('#pendingBookingsV21Toggle .pill,#pendingBookingsOverviewToggle .pill');
    return numberFrom(pill?.textContent)
  }
  function messageCount(){
    const badge=document.querySelector('#overviewOwnersV22 .v25-live-badge.message');
    return numberFrom(badge?.textContent)
  }
  function refreshQuick(){
    const today=document.getElementById('todaySection'),hero=today?.querySelector('.card.hero');if(!today||!hero)return;
    let box=document.getElementById('adminQuickSummaryV32');
    if(!box){box=document.createElement('div');box.id='adminQuickSummaryV32';box.className='admin-quick-summary-v32';hero.insertAdjacentElement('afterend',box)}
    const todayN=numberFrom(document.getElementById('todayReservationsCount')?.textContent),pending=pendingCount(),messages=messageCount();
    const html='<div class="admin-quick-item-v32"><span>Dnes</span><strong>'+todayN+'</strong></div><div class="admin-quick-item-v32 '+(pending?'warn':'')+'"><span>Čaká</span><strong>'+pending+'</strong></div><div class="admin-quick-item-v32 '+(messages?'message':'')+'"><span>Správy</span><strong>'+messages+'</strong></div>';
    if(box.innerHTML!==html)box.innerHTML=html;
  }
  function scheduleQuick(){clearTimeout(quickTimer);quickTimer=setTimeout(refreshQuick,80)}
  function start(){
    upgradeNav();upgradeWeek(document.getElementById('weekList'));upgradeWeek(document.getElementById('nextWeekList'));refreshQuick();
    ['weekList','nextWeekList'].forEach(id=>{const root=document.getElementById(id);if(root)new MutationObserver(()=>upgradeWeek(root)).observe(root,{childList:true})});
    const main=document.getElementById('mainView');if(main)new MutationObserver(()=>{scheduleQuick();upgradeNav()}).observe(main,{childList:true,subtree:true,characterData:true});
    document.addEventListener('click',e=>{if(e.target.closest('[data-tab="week"]'))setTimeout(()=>{upgradeWeek(document.getElementById('weekList'));upgradeWeek(document.getElementById('nextWeekList'))},80);if(e.target.closest('[data-tab="today"]'))setTimeout(refreshQuick,100)},true);
    window.addEventListener('focus',()=>{scheduleQuick();setTimeout(()=>{upgradeWeek(document.getElementById('weekList'));upgradeWeek(document.getElementById('nextWeekList'))},100)});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
