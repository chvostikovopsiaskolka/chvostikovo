<style id="admin-ui-v33-style">
/* v33: dashboard cards, stable week labels, compact closed-day action, refined stats */
#todaySection>.card.hero{display:none!important}
#adminQuickSummaryV32{display:none!important}
.admin-dashboard-v33{margin:4px 0 16px}
.admin-dashboard-date-v33{font-size:13px;font-weight:850;color:#6b7280;text-transform:capitalize;margin:4px 3px 10px;letter-spacing:.01em}
.admin-dashboard-grid-v33{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.admin-dashboard-card-v33{border:1px solid #e5e7eb;background:#fff;border-radius:20px;padding:14px 15px;min-height:88px;text-align:left;color:#111827;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 1px 0 rgba(17,24,39,.02)}
.admin-dashboard-card-v33:active{transform:scale(.985)}
.admin-dashboard-card-v33 span{font-size:11px;color:#6b7280;font-weight:800;line-height:1.2}
.admin-dashboard-card-v33 strong{font-size:27px;line-height:1;font-weight:900}
.admin-dashboard-card-v33 small{font-size:10px;color:#8a93a1;font-weight:700;line-height:1.25}
.admin-dashboard-card-v33.warn strong{color:#d95700}.admin-dashboard-card-v33.message strong{color:#166534}
.admin-dashboard-card-v33.interest{grid-column:1/-1;min-height:76px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.admin-dashboard-card-v33.interest strong{font-size:23px}.admin-dashboard-card-v33.interest small{display:block;margin-top:5px}

.week-date-v33{font-size:16px;font-weight:850;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-transform:lowercase}
.week-day-card-v32 .day-title>strong{display:none!important}
.week-day-card-v32 .day-title{flex:1 1 auto!important}
.week-day-card-v32 .day-actions{flex:0 0 auto!important}
.week-day-card-v32 .day-close-v33{width:34px!important;height:34px!important;min-width:34px!important;min-height:34px!important;border:0!important;border-radius:50%!important;padding:0!important;background:#f3f4f6!important;color:#6b7280!important;display:grid!important;place-items:center!important}
.day-close-v33 svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#weekSection>.card:has(#closedDayDate){display:none!important}
.week-day-card-v32.v33-closed .day-body>.muted.small:first-child{display:none!important}

.admin-stats-head-v33{margin:6px 0 14px}
.admin-stats-head-v33 h2{font-size:27px;margin:0 0 10px;letter-spacing:-.02em}
.admin-stats-tabs-v33{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.admin-stats-tabs-v33 button{border:1px solid #e5e7eb;background:#fff;color:#4b5563;border-radius:17px;min-height:48px;padding:10px 12px;font-size:13px;font-weight:850}
.admin-stats-tabs-v33 button:first-child{background:#fff7ed;color:#d95700;border-color:#fed7aa}
#statsSection>.section-title:first-of-type{display:none!important}
#statsSummary>.card{border-radius:21px!important;box-shadow:0 1px 0 rgba(17,24,39,.02)}
#visitHistoryWrap{margin-top:18px!important;padding-top:3px}
#visitHistoryWrap .visit-history-head{margin:0 2px 7px!important}
#visitHistoryWrap .visit-history-head h3{font-size:20px!important;text-transform:none!important;letter-spacing:-.01em!important;color:#111827!important}
#visitHistoryWrap .visit-history-note{font-size:12px!important;margin-bottom:12px!important}
#visitHistoryWrap .visit-month{border-radius:20px!important;box-shadow:0 1px 0 rgba(17,24,39,.02)}

@media(max-width:520px){
 .admin-dashboard-grid-v33{gap:7px}.admin-dashboard-card-v33{min-height:82px;padding:13px}.admin-dashboard-card-v33 strong{font-size:25px}.admin-dashboard-card-v33.interest{min-height:72px}
 .week-date-v33{font-size:15px}.week-day-card-v32 .day-close-v33{width:32px!important;height:32px!important;min-width:32px!important;min-height:32px!important}.day-close-v33 svg{width:16px;height:16px}
 .admin-stats-head-v33 h2{font-size:25px}.admin-stats-tabs-v33 button{font-size:12px;min-height:45px}
}
</style>
<script id="admin-ui-v33">
(function(){
  if(window.__chvostikovoAdminUiV33)return;
  window.__chvostikovoAdminUiV33=true;
  const BASE='https://tlhcqwsluyqpywymjoxn.supabase.co';
  const KEY='sb_publishable_43vD4AvQwchu1V2MwDbniA_j2tLiLi_';
  const q=id=>document.getElementById(id);
  let dashTimer=0;
  const paw='<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none"><ellipse cx="7" cy="7.2" rx="2.15" ry="2.55"></ellipse><ellipse cx="17" cy="7.2" rx="2.15" ry="2.55"></ellipse><ellipse cx="4.9" cy="12.1" rx="1.85" ry="2.25" transform="rotate(-18 4.9 12.1)"></ellipse><ellipse cx="19.1" cy="12.1" rx="1.85" ry="2.25" transform="rotate(18 19.1 12.1)"></ellipse><path d="M12 11.3c-3.05 0-5.55 2.7-5.55 5.25 0 2.25 2.1 3.65 5.55 3.65s5.55-1.4 5.55-3.65c0-2.55-2.5-5.25-5.55-5.25Z"></path></svg>';
  const chart='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V14m5.3 5.5V9.5m5.4 10V5m5.3 14.5H2.5"></path><path d="m4 10 5.3-3.5 5.4 2.2 5.3-5"></path></svg>';
  const closeDayIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M8 3v4M16 3v4M4 10h16M9 13l6 4M15 13l-6 4"></path></svg>';

  function numberFrom(text){const m=String(text||'').match(/\d+/);return m?Number(m[0]):0}
  function numbersFrom(text){return (String(text||'').match(/\d+/g)||[]).map(Number)}
  function dateLabel(){try{return 'Dnes · '+new Intl.DateTimeFormat('sk-SK',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'}).format(new Date())}catch(_){return 'Dnes'}}
  function dayLabel(iso){try{return new Intl.DateTimeFormat('sk-SK',{weekday:'long',day:'numeric',month:'numeric'}).format(new Date(iso+'T12:00:00')).replace(',','')}catch(_){return iso}}

  function counts(){
    const today=numberFrom(q('todayReservationsCount')?.textContent||q('todayCount')?.textContent);
    const tomorrow=numberFrom(q('tomorrowCount')?.textContent);
    const pending=numberFrom(document.querySelector('#overviewReservationsV22 .v25-live-badge.count')?.textContent||q('pendingBookingsOverviewToggle')?.querySelector('.pill')?.textContent||q('pendingBookingsV21Toggle')?.querySelector('.pill')?.textContent);
    const messages=numberFrom(document.querySelector('#overviewOwnersV22 .v25-live-badge.message')?.textContent||q('customerMessagesCount')?.textContent);
    const leads=numberFrom(q('webLeadsCount')?.textContent);
    const apps=numberFrom(q('webApplicationsCount')?.textContent);
    return {today,tomorrow,pending,messages,leads,apps};
  }
  function openGroup(id){const g=q(id);if(!g)return;const body=g.querySelector(':scope>.dashboard-group-body'),chev=g.querySelector(':scope>.dashboard-group-head .chevron');body?.classList.remove('hidden');chev?.classList.add('open');g.dataset.open='1'}
  function openInner(toggleId,bodyId){const t=q(toggleId),b=q(bodyId);if(b)b.classList.remove('hidden');t?.querySelector('.chevron')?.classList.add('open');return t?.closest('.card')||t||b}
  function focusTarget(kind){
    let target=null;
    if(kind==='today'){openGroup('overviewReservationsV22');target=openInner('todayReservationsToggle','todayReservationsBody')}
    if(kind==='tomorrow'){openGroup('overviewReservationsV22');target=openInner('tomorrowToggle','tomorrowBody')}
    if(kind==='pending'){openGroup('overviewReservationsV22');target=openInner('pendingBookingsOverviewToggle','pendingBookingsOverviewBody')||openInner('pendingBookingsV21Toggle','pendingBookingsV21Body')}
    if(kind==='messages'){openGroup('overviewOwnersV22');target=openInner('customerMessagesToggle','customerMessagesBody')||q('overviewOwnersV22')}
    if(kind==='interest'){
      openGroup('overviewInterestV22');
      openInner('webApplicationsToggle','webApplicationsBody');openInner('webLeadsToggle','webLeadsBody');
      target=q('overviewInterestV22');
    }
    setTimeout(()=>target?.scrollIntoView({behavior:'smooth',block:'center'}),50);
  }
  function renderDashboard(){
    const today=q('todaySection'),hero=today?.querySelector('.card.hero');if(!today||!hero)return;
    q('adminQuickSummaryV32')?.remove();
    let wrap=q('adminDashboardV33');if(!wrap){wrap=document.createElement('div');wrap.id='adminDashboardV33';wrap.className='admin-dashboard-v33';hero.insertAdjacentElement('afterend',wrap)}
    const c=counts();
    const dashboardHtml='<div class="admin-dashboard-date-v33">'+dateLabel()+'</div><div class="admin-dashboard-grid-v33">'+
      '<button class="admin-dashboard-card-v33" data-dash-target="today"><span>Psíkov dnes</span><strong>'+c.today+'</strong><small>otvoriť dnešné rezervácie</small></button>'+
      '<button class="admin-dashboard-card-v33" data-dash-target="tomorrow"><span>Zajtra</span><strong>'+c.tomorrow+'</strong><small>pozrieť rezervácie na zajtra</small></button>'+
      '<button class="admin-dashboard-card-v33 '+(c.pending?'warn':'')+'" data-dash-target="pending"><span>Čakajúce rezervácie</span><strong>'+c.pending+'</strong><small>schváliť alebo zamietnuť</small></button>'+
      '<button class="admin-dashboard-card-v33 '+(c.messages?'message':'')+'" data-dash-target="messages"><span>Správy</span><strong>'+c.messages+'</strong><small>správy od majiteľov</small></button>'+
      '<button class="admin-dashboard-card-v33 interest" data-dash-target="interest"><span><span>Záujem o škôlku</span><small>Záujmy '+c.leads+' · Prihlášky '+c.apps+'</small></span><strong>'+(c.leads+c.apps)+'</strong></button>'+
      '</div>';
    if(wrap.innerHTML===dashboardHtml)return;
    wrap.innerHTML=dashboardHtml;
    wrap.querySelectorAll('[data-dash-target]').forEach(btn=>btn.addEventListener('click',()=>focusTarget(btn.dataset.dashTarget)));
  }
  function scheduleDashboard(){clearTimeout(dashTimer);dashTimer=setTimeout(renderDashboard,80)}

  function authHeaders(){try{const s=JSON.parse(localStorage.getItem('chvostikovo_supabase_session')||sessionStorage.getItem('chvostikovo_supabase_session')||'null');if(!s?.access_token)return null;return {apikey:KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'}}catch(_){return null}}
  async function closeDay(date,count){
    if(count>0&&!confirm('Na '+dayLabel(date)+' už je '+count+' rezervácií. Deň sa označí ako zatvorený, existujúce rezervácie zostanú zachované. Pokračovať?'))return;
    if(count===0&&!confirm('Zatvoriť '+dayLabel(date)+'?'))return;
    const headers=authHeaders();if(!headers){alert('Prihlásenie vypršalo.');return}
    try{
      const r=await fetch(BASE+'/rest/v1/rpc/portal_set_day_closed',{method:'POST',headers,body:JSON.stringify({p_day:date,p_closed:true,p_note:'Zatvorené'}),cache:'no-store'});
      if(!r.ok)throw new Error(await r.text());
      location.reload();
    }catch(e){console.error(e);alert('Deň sa nepodarilo zatvoriť.')}
  }
  function cleanClosedManager(){q('closedDayDate')?.closest('.card')?.remove()}
  function upgradeWeekV33(root){
    cleanClosedManager();if(!root)return;
    [...root.children].forEach(card=>{
      if(!card.classList.contains('card'))return;
      const title=card.querySelector('.day-title[data-date]'),actions=card.querySelector('.day-actions');if(!title||!actions)return;
      const date=title.dataset.date,sourceStrong=title.querySelector('strong');
      let label=title.querySelector('.week-date-v33');if(!label){label=document.createElement('span');label.className='week-date-v33';const chev=title.querySelector('.chevron');chev?.insertAdjacentElement('afterend',label)}label.textContent=dayLabel(date);
      if(sourceStrong)sourceStrong.style.display='none';
      const pills=[...title.querySelectorAll('.pill')],closed=pills.some(p=>/zatvorené/i.test(p.textContent||''));card.classList.toggle('v33-closed',closed);
      const countPill=pills.find(p=>/psov/i.test(p.textContent||'')),count=numberFrom(countPill?.textContent);
      const capacity=actions.querySelector('.day-capacity');
      if(capacity){const nums=numbersFrom(capacity.textContent),cap=nums.length>=2?nums[1]:(nums[0]||8);if(closed){capacity.textContent=cap+' max'}else{capacity.textContent=count+' / '+cap;capacity.classList.toggle('v32-over',count>cap);capacity.classList.toggle('v32-full',count===cap&&cap>0)}}
      if(closed){
        card.querySelector('.day-close-v33')?.remove();
        [...card.querySelectorAll('.day-body>.muted.small')].forEach(el=>{if(/Bez schválených rezervácií/i.test(el.textContent||''))el.remove()});
      }else if(!actions.querySelector('.day-close-v33')){
        const b=document.createElement('button');b.type='button';b.className='day-close-v33';b.title='Zatvoriť deň';b.setAttribute('aria-label','Zatvoriť deň');b.innerHTML=closeDayIcon;b.addEventListener('click',e=>{e.stopPropagation();closeDay(date,count)});actions.appendChild(b);
      }
    });
  }

  function upgradeNavV33(){
    const dogs=document.querySelector('#bottomNav [data-tab="dogs"] .admin-nav-icon-v32'),stats=document.querySelector('#bottomNav [data-tab="stats"] .admin-nav-icon-v32');
    if(dogs)dogs.innerHTML=paw;if(stats)stats.innerHTML=chart;
  }
  function ensureStatsV33(){
    const section=q('statsSection'),summary=q('statsSummary');if(!section||!summary)return;
    let head=q('adminStatsHeadV33');if(!head){head=document.createElement('div');head.id='adminStatsHeadV33';head.className='admin-stats-head-v33';head.innerHTML='<h2>Štatistiky</h2><div class="admin-stats-tabs-v33"><button type="button" data-stats-jump="summary">Prehľad</button><button type="button" data-stats-jump="history">História návštev</button></div>';section.insertBefore(head,section.firstChild);head.querySelectorAll('[data-stats-jump]').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.statsJump==='summary')summary.scrollIntoView({behavior:'smooth',block:'start'});else{const h=q('visitHistoryWrap');if(h)h.scrollIntoView({behavior:'smooth',block:'start'});else setTimeout(()=>q('visitHistoryWrap')?.scrollIntoView({behavior:'smooth',block:'start'}),250)}}))}
    const history=q('visitHistoryWrap');if(history&&history.previousElementSibling!==summary)summary.insertAdjacentElement('afterend',history);
  }
  function start(){
    renderDashboard();upgradeNavV33();cleanClosedManager();upgradeWeekV33(q('weekList'));upgradeWeekV33(q('nextWeekList'));ensureStatsV33();
    const today=q('todaySection');if(today)new MutationObserver(()=>scheduleDashboard()).observe(today,{childList:true,subtree:true,characterData:true});
    ['weekList','nextWeekList'].forEach(id=>{const root=q(id);if(root)new MutationObserver(()=>setTimeout(()=>upgradeWeekV33(root),20)).observe(root,{childList:true,subtree:false})});
    const stats=q('statsSection');if(stats)new MutationObserver(()=>ensureStatsV33()).observe(stats,{childList:true,subtree:false});
    document.addEventListener('click',e=>{
      if(e.target.closest('[data-tab="today"]'))setTimeout(renderDashboard,80);
      if(e.target.closest('[data-tab="week"]'))setTimeout(()=>{cleanClosedManager();upgradeWeekV33(q('weekList'));upgradeWeekV33(q('nextWeekList'))},100);
      if(e.target.closest('[data-tab="stats"]'))setTimeout(ensureStatsV33,100);
    },true);
    window.addEventListener('focus',()=>{scheduleDashboard();upgradeNavV33();setTimeout(()=>{upgradeWeekV33(q('weekList'));upgradeWeekV33(q('nextWeekList'));ensureStatsV33()},80)});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
