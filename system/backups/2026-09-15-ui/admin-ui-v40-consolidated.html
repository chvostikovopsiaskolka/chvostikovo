<style id="admin-ui-v40-style">

.v40-nav-icon{width:25px;height:25px;display:grid;place-items:center;font-size:23px;line-height:1}
.v40-nav-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.v40-nav-label{font-weight:800}
body{padding-bottom:82px}
#weekList,#nextWeekList{gap:11px!important}
#weekList>.card,#nextWeekList>.card{border-radius:23px!important;padding:14px 16px!important;margin:0!important;overflow:hidden}

#weekList .day-title>strong,#nextWeekList .day-title>strong{display:block!important;font-size:16px!important;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:lowercase}

.v40-close-day{width:35px;height:35px;border:0;border-radius:50%;background:#fff7ed;color:#c2410c;display:grid;place-items:center;padding:0}

#closedDayDate{display:none!important}
.admin-stats-tabs-v40{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:5px 0 14px}
.admin-stats-tabs-v40 button{border:1px solid #e5e7eb;background:#fff;color:#6b7280;border-radius:16px;min-height:47px;padding:8px 6px;font-size:11px;font-weight:850;line-height:1.15}
.admin-stats-tabs-v40 button.active{background:#fff7ed;color:#d95700;border-color:#fed7aa}
.v40-hidden{display:none!important}
</style>

<script id="admin-ui-v40">
(function(){

  const svg={home:'<svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5"></path><path d="M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"></path></svg>',week:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M7 3v4M17 3v4M3 10h18"></path></svg>',stats:'<svg viewBox="0 0 24 24"><path d="M4 19.5V14m5.3 5.5V9.5m5.4 10V5m5.3 14.5H2.5"></path><path d="m4 10 5.3-3.5 5.4 2.2 5.3-5"></path></svg>',close:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M8 3v4M16 3v4M4 10h16M9 13l6 4M15 13l-6 4"></path></svg>'};
  let activeStats='visits',refreshBusy=false,timer=0;
  function sess(){try{return JSON.parse(localStorage.getItem('chvostikovo_supabase_session')||sessionStorage.getItem('chvostikovo_supabase_session')||'null')}catch(_){return null}}
  function headers(){const s=sess();return s?.access_token?{apikey:KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'}:null}
  const iso=d=>{const x=new Date(d),m=String(x.getMonth()+1).padStart(2,'0'),day=String(x.getDate()).padStart(2,'0');return `${x.getFullYear()}-${m}-${day}`};
  function formatDay(d){return new Intl.DateTimeFormat('sk-SK',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'}).format(d)}
  async function api(path){const h=headers();if(!h)throw new Error('No session');const r=await fetch(BASE+'/rest/v1/'+path,{headers:h,cache:'no-store'});if(!r.ok)throw new Error(await r.text());return r.json()}
  async function getCounts(){const now=new Date(),tom=new Date(now);tom.setDate(tom.getDate()+1);const a=iso(now),b=iso(tom);const [res,book,msg,forms]=await Promise.all([api(`reservations?select=reservation_date,status&reservation_date=in.(${a},${b})`),api('customer_booking_requests?select=status,taxi_change_status'),api('portal_messages?select=sender_role,read_at'),api('web_form_submissions?select=form_type,status')]);return {today:res.filter(x=>x.reservation_date===a&&!['cancelled','no_show'].includes(x.status)).length,tomorrow:res.filter(x=>x.reservation_date===b&&!['cancelled','no_show'].includes(x.status)).length,pending:book.filter(x=>x.status==='pending'||x.status==='cancel_requested'||x.taxi_change_status==='pending').length,messages:msg.filter(x=>x.sender_role==='customer'&&!x.read_at).length,leads:forms.filter(x=>x.form_type==='lead'&&x.status==='new').length,apps:forms.filter(x=>x.form_type==='application'&&x.status==='new').length}}
  function collapseGroup(group){const body=group?.querySelector(':scope>.dashboard-group-body'),chev=group?.querySelector(':scope>.dashboard-group-head .chevron');body?.classList.add('hidden');chev?.classList.remove('open');if(group)group.dataset.open='0'}
  function openGroup(groupId,targetId){const g=q(groupId);if(!g)return;const body=g.querySelector(':scope>.dashboard-group-body'),chev=g.querySelector(':scope>.dashboard-group-head .chevron');body?.classList.remove('hidden');chev?.classList.add('open');g.dataset.open='1';setTimeout(()=>{const target=q(targetId)||g;if(targetId){const inner=targetId==='todayReservationsToggle'?q('todayReservationsBody'):targetId==='tomorrowToggle'?q('tomorrowBody'):targetId==='pendingBookingsOverviewToggle'?q('pendingBookingsOverviewBody'):targetId==='customerMessagesToggle'?q('customerMessagesBody'):null;if(inner?.classList.contains('hidden'))q(targetId)?.click()}target.scrollIntoView({behavior:'smooth',block:'start'})},40)}
  function buildDashboard(c){const sec=q('todaySection');if(!sec)return;let date=q('adminDateV40');if(!date){date=document.createElement('div');date.id='adminDateV40'}date.textContent='Dnes · '+formatDay(new Date());let dash=q('adminDashboardV40');if(!dash){dash=document.createElement('div');dash.id='adminDashboardV40'}dash.innerHTML=`<button class="v40-dash-card" data-v40="today"><span>Psíkov dnes</span><strong>${c.today}</strong><small>otvoriť dnešné rezervácie</small></button><button class="v40-dash-card" data-v40="tomorrow"><span>Zajtra</span><strong>${c.tomorrow}</strong><small>pozrieť rezervácie na zajtra</small></button><button class="v40-dash-card" data-v40="pending"><span>Čakajúce rezervácie</span><strong>${c.pending}</strong><small>schváliť alebo zamietnuť</small></button><button class="v40-dash-card" data-v40="messages"><span>Správy</span><strong>${c.messages}</strong><small>správy od majiteľov</small></button><button class="v40-dash-card wide" data-v40="interest"><div><span>Záujem o škôlku</span><small>Záujmy ${c.leads} · Prihlášky ${c.apps}</small></div><strong>${c.leads+c.apps}</strong></button>`;const groups=q('overviewGroupsV22'),announce=q('announcementAdminCard'),anchor=groups||announce||sec.firstChild;if(anchor?.parentElement===sec){sec.insertBefore(date,anchor);sec.insertBefore(dash,anchor)}else{sec.prepend(dash);sec.prepend(date)}if(announce&&dash.nextElementSibling!==announce)dash.insertAdjacentElement('afterend',announce);if(groups&&announce?.nextElementSibling!==groups)(announce||dash).insertAdjacentElement('afterend',groups);dash.querySelector('[data-v40="today"]')?.addEventListener('click',()=>openGroup('overviewReservationsV22','todayReservationsToggle'));dash.querySelector('[data-v40="tomorrow"]')?.addEventListener('click',()=>openGroup('overviewReservationsV22','tomorrowToggle'));dash.querySelector('[data-v40="pending"]')?.addEventListener('click',()=>openGroup('overviewReservationsV22','pendingBookingsOverviewToggle'));dash.querySelector('[data-v40="messages"]')?.addEventListener('click',()=>openGroup('overviewOwnersV22','customerMessagesToggle'));dash.querySelector('[data-v40="interest"]')?.addEventListener('click',()=>openGroup('overviewInterestV22'));['overviewReservationsV22','overviewOwnersV22','overviewInterestV22'].forEach(id=>collapseGroup(q(id)));if(q('webLeadsCount'))q('webLeadsCount').textContent=String(c.leads);if(q('webApplicationsCount'))q('webApplicationsCount').textContent=String(c.apps);sec.classList.add('v40-ready')}
  async function refreshDashboard(){if(refreshBusy)return;refreshBusy=true;try{buildDashboard(await getCounts())}catch(e){console.error('v40 dashboard',e);if(!q('todaySection')?.classList.contains('v40-ready'))buildDashboard({today:Number(q('todayReservationsCount')?.textContent)||0,tomorrow:Number((q('tomorrowToggle')?.textContent||'').match(/\d+/)?.[0])||0,pending:0,messages:0,leads:0,apps:0})}finally{refreshBusy=false}}
  function nav(){const cfg={today:[svg.home,'Prehľad'],week:[svg.week,'Týždeň'],dogs:['🐾','Psy'],stats:[svg.stats,'Štatistiky']};document.querySelectorAll('#bottomNav button[data-tab]').forEach(b=>{const c=cfg[b.dataset.tab];if(!c)return;if(b.dataset.v40Nav==='1'&&b.textContent.includes(c[1]))return;b.dataset.v40Nav='1';b.innerHTML=`<span class="v40-nav-icon">${c[0]}</span><span class="v40-nav-label">${c[1]}</span>`});q('bottomNav')?.classList.add('v40-nav-ready')}
  async function closeDay(date,count){if(!confirm(count>0?'Na tento deň už sú rezervácie. Zatvoriť deň a existujúce rezervácie zachovať?':'Zatvoriť tento deň?'))return;const h=headers();if(!h)return;const r=await fetch(BASE+'/rest/v1/rpc/portal_set_day_closed',{method:'POST',headers:h,body:JSON.stringify({p_day:date,p_closed:true,p_note:'Zatvorené'})});if(!r.ok){alert('Deň sa nepodarilo zatvoriť.');return}location.reload()}
  function week(root){if(!root)return;root.querySelectorAll('.day-toggle[data-date]').forEach(t=>{const card=t.closest('.card'),actions=card?.querySelector('.day-actions');if(!card||!actions)return;const strong=t.querySelector('strong');if(strong){strong.style.removeProperty('display');if(!strong.textContent.trim())strong.textContent=new Intl.DateTimeFormat('sk-SK',{weekday:'long',day:'numeric',month:'numeric'}).format(new Date(t.dataset.date+'T12:00:00'))}const closed=!!card.querySelector('.day-open')||[...t.querySelectorAll('.pill')].some(p=>/zatvorené/i.test(p.textContent||''));if(closed){card.querySelectorAll('.day-body>.muted.small').forEach(el=>{if(/Bez schválených rezervácií/i.test(el.textContent||''))el.remove()});actions.querySelector('.v40-close-day')?.remove()}else if(!actions.querySelector('.v40-close-day')){const btn=document.createElement('button');btn.type='button';btn.className='v40-close-day';btn.innerHTML=svg.close;btn.title='Zatvoriť deň';btn.addEventListener('click',e=>{e.stopPropagation();const count=Number((t.querySelector('.pill')?.textContent||'').match(/\d+/)?.[0]||0);closeDay(t.dataset.date,count)});actions.appendChild(btn)}});q('closedDayDate')?.closest('.card')?.remove()}
  function statsHead(){const section=q('statsSection');if(!section)return null;let head=q('adminStatsHeadV40');if(!head){head=document.createElement('div');head.id='adminStatsHeadV40';head.innerHTML='<h2 style="margin:6px 0 10px">Štatistiky</h2><div class="admin-stats-tabs-v40"><button data-v40-stats="visits">Návštevy</button><button data-v40-stats="revenue">Tržby</button><button data-v40-stats="history">História návštev</button></div>';section.insertBefore(head,section.firstChild);head.querySelectorAll('[data-v40-stats]').forEach(b=>b.addEventListener('click',()=>showStats(b.dataset.v40Stats)))}return head}
  function showStats(view='visits'){activeStats=view;const head=statsHead(),summary=q('statsSummary'),history=q('visitHistoryWrap');if(!head||!summary)return;let rev=false;[...summary.children].forEach(el=>{if(el.classList.contains('section-title')&&String(el.textContent).trim().toLowerCase()==='tržby')rev=true;el.classList.toggle('v40-hidden',view==='history'||(view==='visits'&&rev)||(view==='revenue'&&!rev))});if(history)history.classList.toggle('v40-hidden',view!=='history');head.querySelectorAll('[data-v40-stats]').forEach(b=>b.classList.toggle('active',b.dataset.v40Stats===view))}
  function stabilize(){nav();week(q('weekList'));week(q('nextWeekList'));if(!q('statsSection')?.classList.contains('hidden'))showStats(activeStats)}
  function schedule(){clearTimeout(timer);timer=setTimeout(stabilize,40)}
  function start(){nav();setTimeout(refreshDashboard,650);setTimeout(()=>{if(!q('todaySection')?.classList.contains('v40-ready'))refreshDashboard()},950);setTimeout(()=>{if(!q('todaySection')?.classList.contains('v40-ready'))buildDashboard({today:Number(q('todayReservationsCount')?.textContent)||0,tomorrow:Number((q('tomorrowToggle')?.textContent||'').match(/\d+/)?.[0])||0,pending:0,messages:0,leads:0,apps:0})},1600);['weekList','nextWeekList'].forEach(id=>{const r=q(id);if(r)new MutationObserver(schedule).observe(r,{childList:true,subtree:true})});const n=q('bottomNav');if(n)new MutationObserver(schedule).observe(n,{childList:true,subtree:true});document.addEventListener('click',e=>{const tab=e.target.closest('#bottomNav [data-tab]');if(tab){if(tab.dataset.tab==='stats'){activeStats='visits';setTimeout(()=>showStats('visits'),100)}setTimeout(stabilize,80)}},true);window.addEventListener('focus',()=>{stabilize();refreshDashboard()});setInterval(()=>{if(!document.hidden)refreshDashboard()},30000)}

})();
</script>
