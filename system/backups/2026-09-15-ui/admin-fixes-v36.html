<style id="admin-fixes-v36-style">
/* v36: stable week labels + exact fallback paw icon */
.week-day-card-v32 .day-title>strong{display:none!important}
.week-date-v36{display:block!important;flex:1 1 auto;min-width:0;font-size:16px;font-weight:850;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:lowercase;color:#111827}
.admin-nav-paw-v36{display:grid;place-items:center;width:27px;height:27px;font-size:25px;line-height:1}
.v36-live-source{display:none!important}
@media(max-width:520px){.week-date-v36{font-size:15px}.admin-nav-paw-v36{font-size:24px}}
</style>
<script id="admin-fixes-v36">
(function(){
  if(window.__chvostikovoAdminFixesV36)return;
  window.__chvostikovoAdminFixesV36=true;
  const BASE='https://tlhcqwsluyqpywymjoxn.supabase.co';
  const KEY='sb_publishable_43vD4AvQwchu1V2MwDbniA_j2tLiLi_';
  const q=id=>document.getElementById(id);
  let timer=0, interestBusy=false;
  function session(){try{return JSON.parse(localStorage.getItem('chvostikovo_supabase_session')||sessionStorage.getItem('chvostikovo_supabase_session')||'null')}catch(_){return null}}
  function dateLabel(iso){try{return new Intl.DateTimeFormat('sk-SK',{weekday:'long',day:'numeric',month:'numeric'}).format(new Date(iso+'T12:00:00')).replace(',','')}catch(_){return iso}}
  function fixWeek(root){
    if(!root)return;
    root.querySelectorAll('.day-toggle[data-date]').forEach(title=>{
      let label=title.querySelector('.week-date-v36');
      if(!label){label=document.createElement('span');label.className='week-date-v36';const chev=title.querySelector('.chevron');chev?.insertAdjacentElement('afterend',label)}
      label.textContent=dateLabel(title.dataset.date);
    });
  }
  function fixPaw(){
    const btn=document.querySelector('#bottomNav button[data-tab="dogs"]');if(!btn)return;
    if(btn.dataset.v36Paw==='1')return;
    btn.dataset.v36Paw='1';
    btn.innerHTML='<span class="admin-nav-paw-v36" aria-hidden="true">🐾</span><span class="admin-nav-label-v32">Psy</span>';
  }
  function ensureInterestSources(){
    const group=q('overviewInterestV22');if(!group)return null;
    let wrap=q('v36InterestSources');if(!wrap){wrap=document.createElement('span');wrap.id='v36InterestSources';wrap.className='v36-live-source';wrap.innerHTML='<span id="v36LeadSource" class="v25-live-badge">Záujmy 0</span><span id="v36AppSource" class="v25-live-badge">Prihlášky 0</span>';group.appendChild(wrap)}
    return wrap;
  }
  function paintInterest(leads,apps){
    ensureInterestSources();
    const l=q('v36LeadSource'),a=q('v36AppSource');if(l)l.textContent='Záujmy '+leads;if(a)a.textContent='Prihlášky '+apps;
    const card=document.querySelector('#adminDashboardV33 [data-dash-target="interest"]');if(card){const small=card.querySelector('small'),strong=card.querySelector(':scope>strong');if(small)small.textContent=`Záujmy ${leads} · Prihlášky ${apps}`;if(strong)strong.textContent=String(leads+apps)}
  }
  async function refreshInterest(){
    if(interestBusy)return;const s=session();if(!s?.access_token)return;interestBusy=true;
    try{
      const r=await fetch(BASE+'/rest/v1/web_form_submissions?select=form_type,status&status=eq.new',{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token},cache:'no-store'});
      if(!r.ok)throw new Error(await r.text());const rows=await r.json();
      const leads=rows.filter(x=>x.form_type==='lead').length,apps=rows.filter(x=>x.form_type==='application').length;paintInterest(leads,apps);
    }catch(e){console.error('v36 interest count',e)}finally{interestBusy=false}
  }
  function run(){fixWeek(q('weekList'));fixWeek(q('nextWeekList'));fixPaw();ensureInterestSources()}
  function schedule(){clearTimeout(timer);timer=setTimeout(run,40)}
  function start(){
    run();refreshInterest();
    ['weekList','nextWeekList'].forEach(id=>{const root=q(id);if(root)new MutationObserver(schedule).observe(root,{childList:true,subtree:true})});
    const nav=q('bottomNav');if(nav)new MutationObserver(schedule).observe(nav,{childList:true,subtree:true});
    document.addEventListener('click',e=>{if(e.target.closest('[data-tab="week"],[data-tab="dogs"],[data-tab="today"]'))setTimeout(()=>{run();refreshInterest()},90)},true);
    window.addEventListener('focus',()=>{setTimeout(run,50);refreshInterest()});
    setInterval(()=>{if(!document.hidden){run();refreshInterest()}},30000);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
