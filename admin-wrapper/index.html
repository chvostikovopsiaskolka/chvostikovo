<div id="boot" class="app-boot loading-screen loading-concept hidden" role="status" aria-label="Načítavanie aplikácie" aria-live="polite"><svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs><symbol id="ci-loading-paw" viewBox="0 0 64 64"><ellipse cx="32" cy="39" rx="16" ry="13"/><circle cx="14" cy="23" r="7"/><circle cx="27" cy="14" r="7"/><circle cx="41" cy="14" r="7"/><circle cx="52" cy="25" r="7"/></symbol></defs></svg><div class="concept-paws" aria-hidden="true"><svg><use href="#ci-loading-paw"/></svg><svg><use href="#ci-loading-paw"/></svg><svg><use href="#ci-loading-paw"/></svg><svg><use href="#ci-loading-paw"/></svg><svg><use href="#ci-loading-paw"/></svg><svg><use href="#ci-loading-paw"/></svg><svg><use href="#ci-loading-paw"/></svg><svg><use href="#ci-loading-paw"/></svg></div><svg class="concept-watermark" aria-hidden="true"><use href="#ci-loading-paw"/></svg><div class="concept-center"><img class="concept-brand" src="https://app.chvostikovo.sk/loading-brand.png" alt="chvostíkovo" fetchpriority="high"><span class="concept-subtitle">Psia škôlka</span><div class="concept-orbit" aria-hidden="true"><svg class="concept-ring" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="loadingArcGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9983f"/><stop offset="1" stop-color="#dc8fc3"/></linearGradient></defs><circle class="concept-ring-track" cx="60" cy="60" r="56"/><circle class="concept-ring-arc" cx="60" cy="60" r="56" pathLength="100"/></svg><span class="concept-paw"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ci-loading-paw" width="64" height="64" transform="translate(-1 2.5)"/></svg></span></div><p id="bootText" role="alert"></p></div></div><script id="admin-boot-motion-v322">/* Isolated, frame-synchronised loading indicator; no application data access. */
(() => {
  'use strict';
  const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)');
  const arcs=[...document.querySelectorAll('.concept-ring-arc')];
  const paws=[...document.querySelectorAll('.concept-orbit>.concept-paw')];
  let frame=0,previous=0,phase=0,breathe=0;
  const visible=arc=>arc.isConnected&&!document.hidden&&!arc.closest('#boot')?.classList.contains('hidden');
  const draw=time=>{
    frame=0;
    if(!arcs.some(visible)){previous=0;return;}
    if(previous){
      const delta=Math.max(0,Math.min(time-previous,64));
      phase=(phase+delta/(reduced?.matches?4000:1800))%1;
      breathe=(breathe+delta/2200)%1;
    }
    previous=time;
    for(const arc of arcs)if(visible(arc))arc.style.strokeDashoffset=String(-100*phase);
    // HTML transforms have a stable centre on both WebKit and Android SVG renderers.
    const scale=reduced?.matches?1:1+.055*(.5-.5*Math.cos(2*Math.PI*breathe));
    for(const paw of paws)if(visible(paw))paw.style.transform='scale('+scale+')';
    frame=requestAnimationFrame(draw);
  };
  const resume=()=>{if(!frame&&arcs.some(visible))frame=requestAnimationFrame(draw);};
  for(const loading of new Set(arcs.map(arc=>arc.closest('#boot')).filter(Boolean)))
    new MutationObserver(resume).observe(loading,{attributes:true,attributeFilter:['class']});
  document.addEventListener('visibilitychange',resume);
  reduced?.addEventListener?.('change',()=>{breathe=0;for(const paw of paws)paw.style.transform='scale(1)';resume();});
  resume();
})();

</script>
  <script id="admin-workspace-controller-v1">
    // Keep the existing PWA worker, notification routes and Chvostikovo bootstrap.
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js?v=20261014-admin-pwa-v111').catch(()=>{});
    (() => {
      const picker = document.getElementById('projectPicker');
      const boot = document.getElementById('boot');
      const bellarisSplash = document.getElementById('bellarisSplash');
      const dashboard = document.getElementById('bellarisDashboard');
      const returnToPicker = () => {
        dashboard.hidden = true;
        bellarisSplash.hidden = true;
        picker.hidden = false;
        started = false;
      };
      const loadBellarisStyle = () => new Promise((resolve, reject) => {
        if (document.getElementById('bellarisMobileStyle')) { resolve(); return; }
        const link = document.createElement('link');
        link.id = 'bellarisMobileStyle';
        link.rel = 'stylesheet';
        link.href = '/bellaris-admin.css?v=20261030-v1';
        link.onload = resolve;
        link.onerror = () => reject(new Error('Bellaris stylesheet unavailable'));
        document.head.appendChild(link);
      });
      let started = false;
      async function loadChvostikovo() {
        if (started) return;
        started = true;
        picker.hidden = true;
        boot.classList.remove('hidden');
        try {
          const r = await fetch('https://tlhcqwsluyqpywymjoxn.supabase.co/functions/v1/chvostikovo-frontend?v=20261014-admin-pwa-v111', {cache:'no-store'});
          if (!r.ok) throw new Error('server ' + r.status);
          const h = await r.text();
          if (!h.includes('Chvostíkovo')) throw new Error('neplatná odpoveď');
          document.open();document.write(h);document.close();
        } catch (e) {
          const t = document.getElementById('bootText');
          if (t) t.textContent = 'Appka sa nenačítala: ' + (e.message || e);
        }
      }
      document.getElementById('chooseChvostikovo').addEventListener('click', loadChvostikovo);
      document.getElementById('chooseBellaris').addEventListener('click', async () => {
        if (started) return;
        started = true;
        picker.hidden = true;
        bellarisSplash.hidden = false;
        try {
          // Bellaris is rendered inside this PWA. Its data remains in the
          // separate Bellaris Supabase, protected by staff auth and RLS.
          await loadBellarisStyle();
          const {openBellarisMobile} = await import('/bellaris-admin.mjs?v=20261030-v1');
          await openBellarisMobile(dashboard, returnToPicker);
          bellarisSplash.hidden = true;
        } catch {
          bellarisSplash.hidden = true;
          dashboard.hidden = false;
          dashboard.innerHTML = '<div style="padding:34px 22px;text-align:center">' +
            '<h2>Bellaris sa nepodarilo otvoriť</h2>' +
            '<p>Skontrolujte pripojenie a skúste to znova.</p>' +
            '<button id="bellarisRetry" type="button" style="padding:14px;border-radius:12px">Späť na výber</button></div>';
          document.getElementById('bellarisRetry')?.addEventListener('click',returnToPicker);
        }
      });
      const u = new URL(window.location.href);
      const direct = u.searchParams.get('workspace') === 'chvostikovo'
        || (u.search && !u.searchParams.has('workspace'))
        || Boolean(u.hash);
      // Notification deep links and explicit legacy admin links skip the chooser.
      if (direct) void loadChvostikovo();
    })();
  </script>
