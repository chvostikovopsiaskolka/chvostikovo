<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chvostíkovo">
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png?v=20261014-admin-pwa-v111">
  <link rel="icon" type="image/png" href="/icon-192.png?v=20261014-admin-pwa-v111">
  <link rel="manifest" href="/manifest.webmanifest?v=20261014-admin-pwa-v111">
  <title>Chvostíkovo</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #boot{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:16px;padding:24px;background:#fff;color:#6b7280;text-align:center}
    .boot-mark{position:relative;width:54px;height:54px;display:grid;place-items:center}
    .boot-ring{position:absolute;inset:0;border:4px solid #ffedd5;border-top-color:#f97316;border-radius:50%;animation:boot-spin .8s linear infinite}
    .boot-paw{position:relative;z-index:1;font-size:21px;line-height:1}
    #bootText{font-size:14px;font-weight:700;line-height:1.35}
    @keyframes boot-spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-mark" aria-hidden="true"><div class="boot-ring"></div><div class="boot-paw">🐾</div></div>
    <div id="bootText">Načítavam Chvostíkovo…</div>
  </div>
  <script>
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js?v=20261014-admin-pwa-v111').catch(()=>{});
    (async()=>{
      try{
        const r=await fetch('https://tlhcqwsluyqpywymjoxn.supabase.co/functions/v1/chvostikovo-frontend?v=20261014-admin-pwa-v111',{cache:'no-store'});
        if(!r.ok)throw new Error('server '+r.status);
        const h=await r.text();
        if(!h.includes('Chvostíkovo'))throw new Error('neplatná odpoveď');
        document.open();document.write(h);document.close();
      }catch(e){
        const t=document.getElementById('bootText');
        if(t)t.textContent='Appka sa nenačítala: '+(e.message||e);
      }
    })();
  </script>
</body>
</html>
