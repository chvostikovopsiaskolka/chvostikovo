# One-shot preparation on isolated customer fix branch; remove after asset is committed.
name: Prepare legacy Zbierka preview (one shot)
on:
  push:
    branches:
      - fix/customer-legacy-notice-preview-20261112
    paths:
      - .github/workflows/zz-prepare-zbierka-thumb-once.yml
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch known existing public PNG and create same-image WebP thumbnail
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          curl -fLsS --retry 2 --connect-timeout 8 --max-time 55 --max-filesize 4000000 \
            'https://tlhcqwsluyqpywymjoxn.supabase.co/storage/v1/object/public/chvostikovo-bulletin-public/7d062ba9-eb65-4586-9623-9a67f33a2706/81b2588c-1f51-4e16-9d65-16c288c0b054.png' \
            -o /tmp/chvo-zbierka-original.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,features
          import hashlib
          src=Path('/tmp/chvo-zbierka-original.png')
          dst=Path('notice-previews/zbierka-v425.webp')
          assert src.stat().st_size==1487208, f'LIVE original bytes changed, stop: {src.stat().st_size}'
          assert features.check('webp'),'WebP encoder unavailable'
          with Image.open(src) as im:
              assert im.format=='PNG',f'Unexpected original format {im.format}'
              assert im.width<=7000 and im.height<=7000
              resized=ImageOps.exif_transpose(im)
              resized.thumbnail((640,640),Image.Resampling.LANCZOS)
              resized=resized.convert('RGBA' if 'A' in resized.getbands() else 'RGB')
              dst.parent.mkdir(parents=True,exist_ok=True)
              resized.save(dst,'WEBP',quality=78,method=6)
              print(f'Original PNG {im.size}, optimized {resized.size}')
          with Image.open(dst) as im:
              assert im.format=='WEBP' and 1<=im.width<=640 and 1<=im.height<=640
          assert dst.stat().st_size<=250000 and dst.stat().st_size < src.stat().st_size/2,(src.stat().st_size,dst.stat().st_size)
          print('Original SHA256:',hashlib.sha256(src.read_bytes()).hexdigest())
          print('Optimized SHA256:',hashlib.sha256(dst.read_bytes()).hexdigest(),'size:',dst.stat().st_size)
          PY
      - name: Commit only immutable optimized preview to this isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- notice-previews/zbierka-v425.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(customer): optimized preview for existing Zbierka notice'
            git push origin HEAD:fix/customer-legacy-notice-preview-20261112
          fi
