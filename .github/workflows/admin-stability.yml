name: Admin stability checks
on:
  pull_request:
    branches: [customer-portal-production]
  push:
    branches: [customer-portal-production]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test runtime outside the app
        run: |
          npm install --prefix "$RUNNER_TEMP/chvo-admin-deps" --no-save --no-package-lock jsdom@26.1.0 typescript@5.8.3 @electric-sql/pglite@0.5.10
          mkdir -p tests/shared-v244
          ln -s "$RUNNER_TEMP/chvo-admin-deps/node_modules" tests/shared-v244/node_modules
          echo "NODE_PATH=$RUNNER_TEMP/chvo-admin-deps/node_modules" >> "$GITHUB_ENV"
      - name: Default capacity and admin boot v322
        run: |
          node tools/build-admin-capacity-v322.cjs
          node tests/admin-capacity-db-v322.mjs
          node tests/admin-capacity-ui-v322.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v322.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v322.html node tests/admin-proofs-v321.cjs
      - name: Admin loading and remembered-session regression v323
        run: |
          node tools/build-admin-loader-v323.cjs
          node tests/admin-loader-auth-v323.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v323.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v323.html node tests/admin-capacity-ui-v322.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v323.html node tests/admin-proofs-v321.cjs
      - name: Assembled admin startup and analytics
        run: node tests/admin-runtime-v275.cjs
      - name: Account-scoped admin chat v325
        run: |
          node tools/build-admin-chat-v325.cjs
          node tests/admin-chat-v325.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v325.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v325.html node tests/admin-proofs-v321.cjs
      - name: Customer loading motion lifecycle
        run: node tests/loading-motion-v317.cjs
      - name: Staff vaccination photo management v321
        run: |
          node tools/build-admin-proofs-v321.cjs
          node tests/admin-proofs-v321.cjs
          node tests/admin-proofs-api-v321.mjs
          ADMIN_SOURCE=/tmp/admin-candidate-v321.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v321.html node tests/admin-existing-v275.cjs
      - name: Existing photo, CRM, booking and recovery invariants
        run: node tests/admin-existing-v275.cjs
      - name: Viewport transitions and push grammar
        run: |
          node tests/admin-nav-v275.cjs
          node tests/admin-push-v275.cjs

      - name: Vaccine and mobile stats regression against assembled v287
        run: |
          node tools/build-admin-mobile-v287.cjs
          node tests/customer-vaccine-v287.cjs
          node tests/customer-stable-vaccine-photos-v259.cjs
          node tests/customer-native-photo-input-v302.cjs
          ADMIN_SOURCE=../admin-v287.html node tests/admin-mobile-v287.cjs
          ADMIN_SOURCE=../admin-v287.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=../admin-v287.html node tests/admin-existing-v275.cjs
          ADMIN_SOURCE=../admin-v287.html node tests/admin-attendance-v283.cjs
          ADMIN_SOURCE=../admin-v287.html node tests/admin-batch-approval-v284.cjs

      - name: Customer reservation controls v326
        run: |
          node tests/customer-design.cjs
          node tests/customer-taxi-cancel-v326.mjs
          node tests/taxi-notification-v326.cjs

