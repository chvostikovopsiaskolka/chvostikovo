name: Admin stability checks
on:
  pull_request:
    branches: [customer-portal-production]
  push:
    branches: [customer-portal-production]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight customer release version contract
        run: node tests/customer-release-contract.cjs
      - name: Install pinned test runtime outside the app
        run: |
          npm install --prefix "$RUNNER_TEMP/chvo-admin-deps" --no-save --no-package-lock jsdom@26.1.0 typescript@5.8.3 @electric-sql/pglite@0.5.10
          mkdir -p tests/shared-v244
          ln -s "$RUNNER_TEMP/chvo-admin-deps/node_modules" tests/shared-v244/node_modules
          echo "NODE_PATH=$RUNNER_TEMP/chvo-admin-deps/node_modules" >> "$GITHUB_ENV"
      - name: Customer access and abuse ceilings v336
        run: |
          node tests/security-access-v336.mjs
          node tests/security-handlers-v336.mjs
          node tests/admin-access-v336.cjs
      - name: Vaccination push grouping v343
        run: node tests/vaccine-push-batch-v343.cjs
      - name: Private OpenTelemetry ingestion and actual admin v345
        run: |
          npm ci --prefix tools/telemetry-runtime --ignore-scripts
          node tools/build-telemetry-v345.cjs
          git diff --exit-code -- telemetry-v345.js
          node tests/telemetry-db-v345.cjs
          node tools/build-admin-telemetry-v345.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v345.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v345.html node tests/admin-loader-auth-v323.cjs
      - name: Default capacity and admin boot v322
        run: |
          node tools/build-admin-capacity-v322.cjs
          node tests/admin-capacity-db-v322.mjs
          node tests/admin-capacity-ui-v322.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v322.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v322.html node tests/admin-proofs-v321.cjs
      - name: Admin loading and remembered-session regression v323
        run: |
          node tools/build-admin-loader-v323.cjs
          node tests/admin-loader-auth-v323.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v323.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v323.html node tests/admin-capacity-ui-v322.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v323.html node tests/admin-proofs-v321.cjs
      - name: Assembled admin startup and analytics
        run: node tests/admin-runtime-v275.cjs
      - name: Account-scoped admin chat v325
        run: |
          node tools/build-admin-chat-v325.cjs
          node tests/admin-chat-v325.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v325.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v325.html node tests/admin-proofs-v321.cjs
      - name: Customer loading motion lifecycle
        run: node tests/loading-motion-v317.cjs
      - name: Staff vaccination photo management v321
        run: |
          node tools/build-admin-proofs-v321.cjs
          node tests/admin-proofs-v321.cjs
          node tests/admin-proofs-api-v321.mjs
          ADMIN_SOURCE=/tmp/admin-candidate-v321.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v321.html node tests/admin-existing-v275.cjs
      - name: Existing photo, CRM, booking and recovery invariants
        run: node tests/admin-existing-v275.cjs
      - name: Viewport transitions and push grammar
        run: |
          node tests/admin-nav-v275.cjs
          node tests/admin-push-v275.cjs

      - name: Vaccine and mobile stats regression against assembled v287
        run: |
          node tools/build-admin-mobile-v287.cjs
          node tests/customer-vaccine-v287.cjs
          node tests/customer-stable-vaccine-photos-v259.cjs
          node tests/customer-native-photo-input-v302.cjs
          ADMIN_SOURCE=../admin-v287.html node tests/admin-mobile-v287.cjs
          ADMIN_SOURCE=../admin-v287.html node tests/admin-runtime-v275.cjs
          ADMIN_SOURCE=../admin-v287.html node tests/admin-existing-v275.cjs
          ADMIN_SOURCE=../admin-v287.html node tests/admin-attendance-v283.cjs
          ADMIN_SOURCE=../admin-v287.html node tests/admin-batch-approval-v284.cjs

      - name: Customer reservation controls v326
        run: |
          node tests/customer-liquid-v3.cjs
          node tests/customer-liquid-v364.cjs
          node tests/customer-inbox-v363.cjs
          node tests/customer-push-routing-v363.cjs
          node tests/customer-design.cjs
          node tests/customer-surface-v361.cjs
          node tests/customer-magnetic-board-v362.cjs
          node tests/customer-read-recovery-v367.cjs
          node tests/customer-roster-unlinked-v389.cjs
          node tests/customer-session-startup-v357.cjs
          node tests/customer-guide-v358.cjs
          node tests/customer-guide-db-v358.cjs
          node tests/customer-taxi-cancel-v326.mjs
          node tests/taxi-notification-v326.cjs


      - name: Reservation replan and legacy taxi v327
        run: |
          node tests/customer-replan-auto-v327.mjs
          node tests/reservation-taxi-v327.mjs

      - name: Taxi directions, pricing and actual admin v329
        run: |
          node tools/build-admin-taxi-v329.cjs
          node tests/admin-taxi-v329.cjs
          node tests/taxi-directions-v329.mjs
          node tests/taxi-notification-v329.cjs

      - name: Booking requests until day-before 19:00 v331
        run: node tests/booking-deadline-v331.mjs

      - name: Owner booking review and actual admin update source v334
        run: |
          node tools/build-admin-owner-review-v334.cjs
          node tests/admin-owner-review-v334.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v334.html node tests/admin-taxi-v329.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v334.html node tests/admin-runtime-v275.cjs

      - name: Compact admin week and four taxi choices v335
        run: |
          node tools/build-admin-compact-week-v335.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v335.html node tests/admin-owner-review-v334.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v335.html node tests/admin-taxi-v329.cjs
          ADMIN_SOURCE=/tmp/admin-candidate-v335.html node tests/admin-runtime-v275.cjs

  liquid-v3-browser:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce vendored optical bundle
        run: |
          npm ci --prefix tools/liquid-v3 --ignore-scripts
          node tools/build-liquid-v3.cjs
          git diff --exit-code -- vendor/simple-liquid-glass/webgl.js
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/chvo-v3-browser" --no-save --no-package-lock playwright@1.62.1 pngjs@7.0.0
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/chvo-v3-browser/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/chvo-v3-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Current customer browser regression and pixel proof
        run: |
          node tests/customer-android-dock-v389-browser.cjs
          node tests/customer-auth-glass-v386-browser.cjs
          V3_ENGINE=webkit node tests/customer-auth-glass-v386-browser.cjs
          node tests/customer-reels-v385-browser.cjs
          V3_ENGINE=webkit node tests/customer-reels-v385-browser.cjs
          node tests/customer-liquid-browser-v364.cjs
          node tests/customer-liquid-v3-browser.cjs
          node tests/customer-followup-v376-browser.cjs
          V3_ENGINE=webkit node tests/customer-followup-v376-browser.cjs
          V3_ENGINE=webkit V3_LOW_CONTEXT=1 node tests/customer-liquid-v3-browser.cjs
          node tests/customer-inbox-browser-v363.cjs
          node tests/customer-guide-browser-v358.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquid-v3-browser-evidence
          path: |
            /tmp/chvo-v386-auth/
            /tmp/chvo-v385-screenshots/
            /tmp/chvo-v3-screenshots/
            /tmp/chvo-v376-screenshots/
