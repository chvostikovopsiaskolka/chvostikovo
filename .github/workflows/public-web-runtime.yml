name: Public web runtime

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'scripts/**', '.github/workflows/public-web-runtime.yml']
  workflow_dispatch:
  schedule:
    # Once daily at 07:17 UTC; this is a browser test, with no AI calls.
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: public-web-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    runs-on: ubuntu-latest
    # Version-pinned official image provides browser binaries and all system libraries without fragile apt mirror fetches.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    # Browser installation can exceed 10 minutes on a cold GitHub runner.
    # Keep full Chromium + WebKit regression coverage and give it enough time.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        site: ["chvostikovo"]
    steps:
      - uses: actions/checkout@v4
      - name: Verify preview utilities and provide unzip fallback
        # Official image has Python and curl, but Bun setup expects a missing
        # unzip executable. Avoid apt mirrors and use Python's stdlib ZipFile.
        run: |
          command -v python3
          command -v curl
          node --version
          if ! command -v unzip >/dev/null 2>&1; then
            mkdir -p /tmp/web-preview-tools
            cat > /tmp/web-preview-tools/unzip <<'PY'
          #!/usr/bin/env python3
          import os
          import sys
          import zipfile
          args = sys.argv[1:]
          destination = "."
          if "-d" in args:
              pos = args.index("-d")
              destination = args[pos + 1]
              del args[pos:pos + 2]
          archive = next((arg for arg in args if arg.lower().endswith(".zip")), None)
          if archive is None:
              sys.exit("unzip fallback: expected an archive .zip argument")
          with zipfile.ZipFile(archive) as zipped:
              zipped.extractall(destination)
              # stdlib extraction does not preserve Unix executable bits;
              # Bun binaries need the original mode from the ZIP metadata.
              for member in zipped.infolist():
                  mode = (member.external_attr >> 16) & 0o777
                  if mode and not member.is_dir():
                      os.chmod(os.path.join(destination, member.filename), mode)
          PY
            chmod +x /tmp/web-preview-tools/unzip
            echo "/tmp/web-preview-tools" >> "$GITHUB_PATH"
          fi
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify impact selection guards
        run: node --test scripts/public-web-impact.test.cjs
      - name: Select affected candidate routes
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMPACT_BASE: ${{ github.event.pull_request.base.sha }}
          IMPACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/public-web-impact.cjs "$IMPACT_BASE" "$IMPACT_HEAD" >> "$GITHUB_ENV"
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix /tmp/web-runtime --no-package-lock --no-audit --no-fund playwright@1.56.1
          # Browsers and native dependencies are preinstalled in the pinned Playwright container.
      - name: Build candidate for pull requests
        if: github.event_name == 'pull_request'
        run: |
          bun install --frozen-lockfile
          node scripts/restore-cori-image.mjs
          bun run build:pages
          if [ "$WEB_RUNTIME_SCOPE" = "content" ]; then
            node scripts/mobile-dock-contract.cjs
            bun run check:types
            node scripts/check-seo-indexability.cjs
          fi
          python3 -m http.server 4173 --directory dist/client > /tmp/web-runtime-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
      - name: Verify hydrated pages in Chromium and Safari WebKit
        env:
          NODE_PATH: /tmp/web-runtime/node_modules
          WEB_SITE: ${{ matrix.site }}
          WEB_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173' || 'https://chvostikovo.sk' }}
        # Keep the original required job identity. Both engines have independent
        # output directories and processes; neither success can mask a failure.
        run: |
          RUNTIME_ENGINE=chromium RUNTIME_REPORT_DIR=runtime-report/chromium node scripts/check-web-runtime.cjs > /tmp/chromium-runtime.log 2>&1 &
          chromium_pid=$!
          RUNTIME_ENGINE=webkit RUNTIME_REPORT_DIR=runtime-report/webkit node scripts/check-web-runtime.cjs > /tmp/webkit-runtime.log 2>&1 &
          webkit_pid=$!
          chromium_status=0
          webkit_status=0
          wait "$chromium_pid" || chromium_status=$?
          wait "$webkit_pid" || webkit_status=$?
          echo "::group::Chromium results"
          cat /tmp/chromium-runtime.log
          echo "::endgroup::"
          echo "::group::WebKit results"
          cat /tmp/webkit-runtime.log
          echo "::endgroup::"
          echo "Chromium status=$chromium_status; WebKit status=$webkit_status"
          test "$chromium_status" -eq 0 && test "$webkit_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-web-runtime-${{ matrix.site }}-${{ github.run_id }}
          path: runtime-report
          retention-days: 7
