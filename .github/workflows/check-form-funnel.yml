name: Validate form tracking PR
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/site/**"
      - "src/lib/**"
      - "supabase/functions/website-landing-event/**"
      - "scripts/**"
      - "public/sitemap.xml"
      - "vite.config.pages.ts"
      - "SEO_CHECKLIST.md"
      - ".github/workflows/check-form-funnel.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/restore-cori-image.mjs
      - name: Restricted-storage consent regression
        run: bun scripts/check-consent-resilience.mjs
      - name: GA4 acquisition attribution regression
        run: bun scripts/check-ga4-attribution.mjs
      - name: Critical form regression
        run: bun run check:critical-forms
      - name: AI referral regression
        run: node scripts/ai-referral-checks.cjs
      - name: Mobile dock contract
        run: node scripts/mobile-dock-contract.cjs
      - name: TypeScript validation
        run: bun run check:types
      - name: Build static pages
        run: bun run build:pages
      - name: Verify SEO route, sitemap and HTML
        run: node scripts/check-seo-indexability.cjs
