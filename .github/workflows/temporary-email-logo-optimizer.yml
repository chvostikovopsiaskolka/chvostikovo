name: Temporary email-logo optimizer (remove after asset generation)
on:
  push:
    branches:
      - fix/customer-email-logo-optimized-20261110

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate small faithful PNG from existing customer logo
        run: |
          python -m pip install pillow==11.3.0
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          from shutil import copy2

          source = Path('loading-brand.png')
          assert source.is_file()
          with Image.open(source) as original:
              assert original.size == (2005, 400), original.size
              scaled = original.convert('RGBA').resize((800, 160), Image.Resampling.LANCZOS)
              scaled.save('/tmp/chvo-email-rgba.png', optimize=True, compress_level=9)
              indexed = scaled.quantize(colors=256, method=Image.Quantize.FASTOCTREE, dither=Image.Dither.NONE)
              indexed.save('/tmp/chvo-email-indexed.png', optimize=True, compress_level=9)
              options = [Path('/tmp/chvo-email-rgba.png'), Path('/tmp/chvo-email-indexed.png')]
              best = min(options, key=lambda p: p.stat().st_size)
              target = Path('email-logo-800-v1.png')
              copy2(best, target)
              assert target.stat().st_size < 90000, f'Unexpected PNG size {target.stat().st_size}'
              with Image.open(target) as check:
                  assert check.size == (800, 160)
                  assert check.convert('RGBA').getpixel((0, 0))[3] == 0
              print(f'Original {source.stat().st_size} bytes -> optimized {target.stat().st_size} bytes ({best.name})')
          PY
      - name: Push generated asset only to isolated temporary branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/customer-email-logo-optimized-20261110"
          git add -- email-logo-800-v1.png
          if git diff --cached --quiet; then
            echo 'Optimized image already committed'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: generate optimized customer confirmation email logo"
          git push origin "HEAD:refs/heads/fix/customer-email-logo-optimized-20261110"
