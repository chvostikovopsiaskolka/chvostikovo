name: Android Capacitor build
on:
  workflow_dispatch:
  push:
    branches: [feat/capacitor-android-v361]
  pull_request:
    branches: [customer-portal-production, feat/capacitor-android-v361, codex/android-welcome-v403, fix/android-v419-password-eye-20261110]
    paths: ['mobile/**', 'app.js', 'back-swipe.js', 'email-confirmed.js', '.github/workflows/android-capacitor.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install pinned dependencies and sync shared assets
        working-directory: mobile
        run: |
          npm ci
          npm run sync
          npm test
      - name: Existing PWA regressions
        run: |
          npm ci --prefix tests/shared-v244 --ignore-scripts
          node tests/customer-session-startup-v357.cjs
          node tests/customer-native-schema-v393.cjs
          node tests/customer-mobile-v393.cjs
          node tests/customer-design.cjs
          node tests/customer-image-network-v404.cjs
          node tests/customer-confirm-return-v155.cjs
          node tests/customer-auth-recovery-v418.cjs
          node tests/customer-guide-v358.cjs
          node tests/customer-locale-v409.cjs
          node tests/customer-onboarding-v413.cjs
          node tests/customer-shop-v414.cjs
          NODE_PATH="$PWD/tests/shared-v244/node_modules" node tests/customer-locale-v409-browser.cjs
          NODE_PATH="$PWD/tests/shared-v244/node_modules" node tests/customer-legal-v411.cjs
          node tests/customer-release-contract.cjs
      - name: Compile debug APK and unsigned release bundle
        working-directory: mobile/android
        run: ./gradlew assembleDebug bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: chvostikovo-android-preview
          retention-days: 30
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/www/mobile-build.json

  signing-script-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse signing script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $scriptPath = (Resolve-Path 'mobile/Prepare-Play-v435.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'PowerShell 5.1 parser PASS'
      - name: Reuse historical Firebase config on Windows PowerShell 5.1 (no real credentials)
        shell: powershell
        run: |
          $originalProfile = $env:USERPROFILE
          $fixtureHome = Join-Path $env:RUNNER_TEMP ('chvo-firebase-fixture-' + [guid]::NewGuid().ToString('N'))
          $target = 'mobile/android/app/google-services.json'
          try {
            if (Test-Path -LiteralPath $target) { throw 'CI must not contain an existing Firebase file' }
            $env:USERPROFILE = $fixtureHome
            $key = Join-Path $fixtureHome 'Documents/Chvostikovo-Keys/chvostikovo-upload.jks'
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $key) | Out-Null
            Set-Content -LiteralPath $key -Encoding Ascii -Value 'CI fixture, not a real keystore'
            $older = Join-Path $fixtureHome 'Chvostikovo-Android-v412/mobile/android/app/google-services.json'
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $older) | Out-Null
            Set-Content -LiteralPath $older -Encoding Ascii -Value '{"client":[{"client_info":{"android_client_info":{"package_name":"sk.chvostikovo.app"}}}]}'
            & '.\mobile\Prepare-Play-v435.ps1' -PreflightOnly
            if (-not (Test-Path -LiteralPath $target)) { throw 'Historical Firebase copy failed' }
            $copied = Get-Content -LiteralPath $target -Raw | ConvertFrom-Json
            if ($copied.client[0].client_info.android_client_info.package_name -ne 'sk.chvostikovo.app') { throw 'Firebase package differs' }
            Write-Host 'PASS: known prior Firebase v412 reused without file dialog or new setup'
          } finally {
            $env:USERPROFILE = $originalProfile
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Force }
            if (Test-Path -LiteralPath $fixtureHome) { Remove-Item -LiteralPath $fixtureHome -Recurse -Force }
          }
