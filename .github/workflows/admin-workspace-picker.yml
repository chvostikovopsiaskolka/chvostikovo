name: Admin wrapper workspace picker
on:
  pull_request:
    paths:
      - "admin-wrapper/**"
      - "admin-wrapper/project-picker.test.cjs"
      - ".github/workflows/admin-workspace-picker.yml"
  push:
    branches:
      - "admin-wrapper/project-picker-20261030"
    paths:
      - "admin-wrapper/**"
      - "admin-wrapper/project-picker.test.cjs"
      - ".github/workflows/admin-workspace-picker.yml"
permissions:
  contents: read
jobs:
  workspace-picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolated admin boot and routing checks
        run: node admin-wrapper/project-picker.test.cjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact guarded stable admin candidate
        run: |
          export ADMIN_SOURCE="$RUNNER_TEMP/admin-stability.html"
          node admin-wrapper/build-disclosure.mjs
          echo "ADMIN_SOURCE=$ADMIN_SOURCE" >> "$GITHUB_ENV"
          node admin-wrapper/check-assembled.mjs
          node --test admin-wrapper/admin-lifecycle-patch.test.mjs admin-wrapper/admin-source.test.mjs admin-wrapper/reporting-period.test.mjs admin-wrapper/revenue-evidence.test.mjs
      - name: Install isolated regression dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/admin-stability-runtime" --no-save --no-package-lock jsdom@26.1.0 playwright@1.56.1
          mkdir -p tests/shared-v244
          ln -s "$RUNNER_TEMP/admin-stability-runtime/node_modules" tests/shared-v244/node_modules
          echo "NODE_PATH=$RUNNER_TEMP/admin-stability-runtime/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/admin-stability-runtime/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Actual assembled lifecycle and authentication regressions
        run: |
          node tests/admin-lifecycle-20261101.cjs
          node tests/admin-auth-lifecycle-20261101.cjs
      - name: Render scroll and viewport transitions
        run: |
          node admin-wrapper/layout.browser.mjs
          BELLARIS_BROWSER=webkit node admin-wrapper/layout.browser.mjs
          node admin-wrapper/dock-identity.browser.mjs
          BELLARIS_BROWSER=webkit node admin-wrapper/dock-identity.browser.mjs
          node admin-wrapper/workspace-flow.browser.mjs
          BELLARIS_BROWSER=webkit node admin-wrapper/workspace-flow.browser.mjs
          node admin-wrapper/revenue-disclosure.browser.mjs
          BELLARIS_BROWSER=webkit node admin-wrapper/revenue-disclosure.browser.mjs
