name: Aria SQL isolated fixture
on:
  push:
    branches: [qa/aria-sql-release-20261125]
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: localfixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test actual migration and staff RPC in disposable PostgreSQL
        env:
          PGPASSWORD: localfixture
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/qa/aria-sql-fixture.sql
